openapi: 3.0.3
info:
  title: Bakery Platform API
  version: 2.0.0
  description: >
    Central API specification for the bakery platform. This document was regenerated from the live backend
    implementation and reflects the Sprint 5 state of the codebase. The server is mounted at /api and the
    contract is intended to match the actual Express routes and role checks in the app.
  license:
    name: Internal
servers:
  - url: http://localhost:5000/api
    description: Local development server
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Categories
  - name: Products
  - name: Ingredients
  - name: Sales
  - name: Employees
  - name: Suppliers
  - name: Purchase Orders
  - name: Customer Orders
  - name: Analytics
  - name: AI Forecast

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /forecast:
    get:
      tags: [AI Forecast]
      summary: Naive baseline forecast for a product
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Forecast payload with confidence and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '501':
          description: Endpoint reserved for future model versions

  /production-recommendations:
    get:
      tags: [AI Forecast]
      summary: Production recommendations placeholder
      responses:
        '501':
          description: Not implemented yet

  /anomalies:
    get:
      tags: [AI Forecast]
      summary: Anomaly detection placeholder
      responses:
        '501':
          description: Not implemented yet

  /segmentation:
    get:
      tags: [AI Forecast]
      summary: Customer or product segmentation placeholder
      responses:
        '501':
          description: Not implemented yet

  /insights:
    get:
      tags: [AI Forecast]
      summary: AI insights placeholder
      responses:
        '501':
          description: Not implemented yet

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated session returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/users:
    get:
      tags: [Auth]
      summary: List all users (ADMIN only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create category (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      summary: Delete category (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      summary: Create product (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                  nullable: true
                stock_quantity:
                  type: integer
                recipe:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Update product (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                  nullable: true
                stock_quantity:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete product (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/recipe:
    get:
      tags: [Products]
      summary: Get product recipe
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recipe items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeItem'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Products]
      summary: Set or replace recipe (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecipeInput'
      responses:
        '200':
          description: Recipe updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/produce:
    post:
      tags: [Products]
      summary: Produce product batch (ADMIN, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Production result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingredients:
    get:
      tags: [Ingredients]
      summary: List ingredients
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/IngredientStatusQuery'
      responses:
        '200':
          description: Ingredient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
    post:
      tags: [Ingredients]
      summary: Create ingredient (ADMIN, STOCK, PRODUCTION)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unit]
              properties:
                name:
                  type: string
                unit:
                  type: string
                current_stock:
                  type: number
                minimum_stock:
                  type: number
                cost_per_unit:
                  type: number
                expiration_date:
                  type: string
                  format: date
                supplier_id:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingredients/{id}:
    get:
      tags: [Ingredients]
      summary: Get ingredient detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Ingredient detail with recent movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ingredients]
      summary: Update ingredient (ADMIN, STOCK, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                unit:
                  type: string
                minimum_stock:
                  type: number
                cost_per_unit:
                  type: number
                expiration_date:
                  type: string
                  format: date
                supplier_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Ingredients]
      summary: Delete ingredient (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Ingredient deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingredients/{id}/movement:
    post:
      tags: [Ingredients]
      summary: Apply stock movement (ADMIN, STOCK, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movement_type, quantity]
              properties:
                movement_type:
                  type: string
                  enum: [IN, OUT, WASTE, ADJUSTMENT]
                quantity:
                  type: number
                reason:
                  type: string
                expiration_date:
                  type: string
                  format: date
                batch_number:
                  type: string
      responses:
        '200':
          description: Stock movement applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ingredients/alerts:
    get:
      tags: [Ingredients]
      summary: Get stock and expiration alerts
      responses:
        '200':
          description: Alert summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummary'

  /stocks:
    get:
      tags: [Ingredients]
      summary: Stock alias for ingredients listing
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/IngredientStatusQuery'
      responses:
        '200':
          description: Ingredient list in stock alias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'

  /stocks/alerts:
    get:
      tags: [Ingredients]
      summary: Stock alias for low-stock and expiration alerts
      responses:
        '200':
          description: Alert summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummary'

  /stocks/{id}:
    get:
      tags: [Ingredients]
      summary: Stock alias detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Ingredient detail with movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /stocks/{id}/movement:
    post:
      tags: [Ingredients]
      summary: Stock alias movement endpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: Stock movement applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sales:
    get:
      tags: [Sales]
      summary: List sales (ADMIN, CASHIER, PRODUCTION)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/ProductIdQuery'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
      responses:
        '200':
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sales]
      summary: Create sale (ADMIN, CASHIER, PRODUCTION)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sales/history:
    get:
      tags: [Sales]
      summary: Sales history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/ProductIdQuery'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
      responses:
        '200':
          description: Sales history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sales/metrics:
    get:
      tags: [Sales]
      summary: Get sales metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sales KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Sale detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/{id}/ticket/html:
    get:
      tags: [Sales]
      summary: Get printable HTML sale ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: HTML ticket content
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees:
    get:
      tags: [Employees]
      summary: List employee records
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Employees]
      summary: Create employee or link an existing user account (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employees/schedules:
    get:
      tags: [Employees]
      summary: List schedules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Employees]
      summary: Create schedule (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employees/leaves:
    get:
      tags: [Employees]
      summary: List leave requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leave list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leave'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Employees]
      summary: Create leave request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveInput'
      responses:
        '201':
          description: Leave created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leave'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employees/leaves/{id}/status:
    put:
      tags: [Employees]
      summary: Update leave status (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Leave updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leave'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees/{id}:
