  /api/purchase-orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      summary: Changer le statut d'une commande fournisseur
      description: |
        Transition DRAFT vers ORDERED puis RECEIVED (réception qui réapprovisionne
        le stock matières premières et invalide tous les caches IA), ou CANCELLED.
        Rôles autorisés : ADMIN, STOCK. Audit RECEIVE_ORDER sur réception.
      tags: [Commandes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/PurchaseOrderStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/customer-orders:
    get:
      summary: Liste des commandes client spéciales
      description: "Rôles autorisés : ADMIN, CASHIER, PRODUCTION. Filtres query : status, delivery_date."
      tags: [Commandes]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CustomerOrderStatus'
        - name: delivery_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Liste des commandes client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Créer une commande client spéciale
      description: |
        Crée une commande personnalisée au statut PENDING (prix recalculé côté
        serveur à partir du catalogue produits). Rôles autorisés : ADMIN, CASHIER.
      tags: [Commandes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, delivery_date, items]
              properties:
                customer_name:
                  type: string
                customer_phone:
                  type: string
                delivery_date:
                  type: string
                  format: date-time
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                special_instructions:
                  type: string
      responses:
        '201':
          description: Commande créée en PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          description: Produit introuvable ou payload invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/customer-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      summary: Détail d'une commande client
      description: "Rôles autorisés : ADMIN, CASHIER, PRODUCTION."
      tags: [Commandes]
      responses:
        '200':
          description: Commande trouvée avec ses lignes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Modifier une commande client PENDING
      description: |
        Recrée les lignes et recalcule le prix total. Seule une commande PENDING
        peut être modifiée. Rôles autorisés : ADMIN, CASHIER.
      tags: [Commandes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                customer_phone:
                  type: string
                delivery_date:
                  type: string
                  format: date-time
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                special_instructions:
                  type: string
      responses:
        '200':
          description: Commande mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          description: Statut non modifiable (seul PENDING est éditable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Supprimer une commande client PENDING
      description: Rôle ADMIN uniquement. Seule une commande PENDING peut être supprimée.
      tags: [Commandes]
      responses:
        '200':
          description: Commande supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/customer-orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      summary: Changer le statut d'une commande client
      description: |
        Transition du cycle de production de la commande (PENDING, IN_PRODUCTION,
        READY, DELIVERED, CANCELLED). Rôles autorisés : ADMIN, PRODUCTION.
      tags: [Commandes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/CustomerOrderStatus'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications:
    get:
      summary: Liste des notifications filtrées par RBAC
      description: |
        Renvoie les notifications visibles par l'utilisateur connecté, filtrées
        par son rôle. Filtres query : unread(true), module, category, limit.
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          required: false
          description: true pour ne retourner que les non lues
          schema:
            type: string
            enum: ['true', 'false']
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Liste des notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/unread-count:
    get:
      summary: Nombre de notifications non lues
      description: Compteur des notifications non lues visibles par l'utilisateur courant.
      tags: [Notifications]
      responses:
        '200':
          description: Compteur de non lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/read-all:
    put:
      summary: Marquer toutes les notifications comme lues
      description: Marque toutes les notifications de l'utilisateur courant comme lues.
      tags: [Notifications]
      responses:
        '200':
          description: Toutes marquées comme lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      summary: Marquer une notification comme lue
      description: Marque une seule notification comme lue (propriétaire uniquement).
      tags: [Notifications]
      responses:
        '200':
          description: Notification marquée comme lue
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      summary: Supprimer une notification
      description: Supprime une notification (propriétaire uniquement).
      tags: [Notifications]
      responses:
        '200':
          description: Notification supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/dashboard/summary:
    get:
      summary: Synthèse stratégique du tableau de bord
      description: |
        Sprint 5 - Dashboard stratégique ADMIN. Agrège les KPIs issus des
        services existants (SalesService, StockService) et les sorties IA déjà
        disponibles (/ai/*), sans recalcul. Cache mémoire de 5 minutes (TTL).
        Rôle autorisé : ADMIN uniquement.
      tags: [Dashboard]
      responses:
        '200':
          description: Synthèse consolidée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/analytics/export:
    get:
      summary: Export consolidé pour la phase IA et analytique
      description: |
        Jeu de données historique consolidé (ventes, stocks, produits) destiné
        à la phase IA et analytique. Lecture seule. Rôle autorisé : ADMIN.
      tags: [Analytics]
      responses:
        '200':
          description: Jeu de données consolidé
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/audit-logs:
    get:
      summary: Journal des actions (audit)
      description: |
        Récupère les journaux d'audit avec pagination et filtres (action,
        entity_type, user_id, start_date, end_date, page, limit).
        Rôle autorisé : ADMIN. Alias identique sans préfixe /api : /audit-logs.
      tags: [Audit Logs]
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Journaux paginés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/health:
    get:
      summary: Santé du service IA (proxy FastAPI)
      description: |
        Proxy inverse Express vers GET /health du service IA FastAPI.
        Le routeur /ai impose requireAuth sur tous ses endpoints, y compris
        celui-ci. Réponse du service : status ok et nom du service.
      tags: [IA]
      responses:
        '200':
          description: Service IA opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: bakery-ai-service
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Service IA injoignable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  status:
                    type: integer

  /ai/forecast:
    get:
      summary: Prévision de demande pour un produit
      description: |
        Sprint 1 - endpoint IA actif. Renvoie la prévision de demande pour un
        produit avec niveau de confiance et version du modèle. Résultat mis en
        cache (product_id + horizon + model_version).
        Rôles autorisés : ADMIN, PRODUCTION, STOCK. Refusés (403) : CASHIER, EMPLOYEE.
      tags: [IA]
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
        - name: horizon_days
          in: query
          required: false
          description: Horizon de prévision en jours (défaut 7)
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Prévision calculée ou en cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/production-recommendations:
    get:
      summary: Recommandations de production
      description: |
        Recommandations de production par produit (quantité à produire, raison,
        confiance). Rôles autorisés : ADMIN, PRODUCTION. Refusés (403) : STOCK,
        CASHIER, EMPLOYEE.
      tags: [IA]
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Recommandation de production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionRecommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/anomalies:
    get:
      summary: Détection d'anomalies de stock
      description: |
        Sprint 3 - anomalies orientées stock (ruptures, chutes de ventes,
        péremptions). Rôles autorisés : ADMIN, STOCK. Refusés (403) :
        PRODUCTION, CASHIER, EMPLOYEE.
      tags: [IA]
      responses:
        '200':
          description: Anomalies détectées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/segmentation:
    get:
      summary: Segmentation des produits
      description: |
        Segmentation des produits pour décisions tarifaires et promotionnelles.
        Rôle autorisé : ADMIN (seul rôle décisionnel stratégique).
        Refusés (403) : PRODUCTION, STOCK, CASHIER, EMPLOYEE.
      tags: [IA]
      responses:
        '200':
          description: Segments produits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/insights:
    get:
      summary: Insights business consolidés
      description: |
        Insights agrégés issus de la segmentation. Rôles autorisés : ADMIN.
        Refusés (403) : PRODUCTION, STOCK, CASHIER, EMPLOYEE.
      tags: [IA]
      responses:
        '200':
          description: Insights business
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/etl/run:
    post:
      summary: Lancer le pipeline ETL IA
      description: |
        Exécute l'extraction et le stockage du jeu de données historique
        (extract_and_store_etl) puis invalide tous les caches de prévision.
        Rôle autorisé : ADMIN uniquement.
      tags: [IA]
      responses:
        '200':
          description: ETL exécuté
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    description: Résultat renvoyé par le pipeline ETL
                  confidence:
                    type: object
                    properties:
                      level:
                        type: string
                      interval:
                        type: array
                        items:
                          type: number
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/cache/invalidate:
    post:
      summary: Invalider les caches IA
      description: |
        Invalide les caches des endpoints IA (forecast, production-recommendations,
        segmentation, insights). Paramètre optionnel product_id pour cibler un
        produit. Rejoint le service IA via le proxy fallback (authentification
        requise, sans restriction de rôle explicite côté Express).
      tags: [IA]
      parameters:
        - name: product_id
          in: query
          required: false
          description: Cible un produit précis, sinon invalide tout
          schema:
            type: integer
      responses:
        '200':
          description: Caches invalidés
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
