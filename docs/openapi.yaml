openapi: 3.1.0
info:
  title: ERP Pâtisserie Platform API
  version: 1.0.0
  description: >
    API consolidée de la Plateforme ERP Pâtisserie. Documente uniquement les
    endpoints réellement présents dans le backend Express/Knex (backend/src)
    et son reverse-proxy vers le service IA FastAPI (ai-service). Validation
    Zod, matrice RBAC réelle, authentification JWT Bearer (expiration 24 h).

servers:
  - url: http://localhost:4000
    description: Backend Express local (proxya /ai/* vers le service IA, port 8000)

tags:
  - name: Auth
    description: Authentification et profil (JWT)
  - name: Santé
    description: Endpoint de santé
  - name: Produits
    description: Catalogue produits et recettes
  - name: Catégories
    description: Catégories de produits
  - name: Stocks
    description: Ingrédients et mouvements de stock
  - name: Ventes
    description: Ventes, historique, métriques et tickets
  - name: Employés
    description: RH — profils, plannings, congés, self-service
  - name: Fournisseurs
    description: Fournisseurs et performance
  - name: Commandes
    description: Commandes fournisseur (PO) et commandes client
  - name: Notifications
    description: Notifications filtrées par RBAC
  - name: Dashboard
    description: Dashboard stratégique (ADMIN)
  - name: Audit Logs
    description: Journal des actions (ADMIN)
  - name: Analytics
    description: Export consolidé (ADMIN)
  - name: IA
    description: Endpoints IA (proxy vers FastAPI)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identifiant entier de la ressource
      schema:
        type: integer
        format: int64

  schemas:
    UserRole:
      type: string
      description: Rôles utilisateur (enum migration users.role)
      enum: [ADMIN, PRODUCTION, CASHIER, STOCK, EMPLOYEE]
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    LoginResponse:
      type: object
      description: Réponse de POST /api/auth/login
      required: [token, user]
      properties:
        token:
          type: string
          description: "JWT (24 h) à placer dans Authorization: Bearer <token>"
        user:
          $ref: '#/components/schemas/User'
    Product:
      type: object
      description: Produit avec sa recette (ingrédients) jointe
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        stock_quantity:
          type: integer
        is_active:
          type: boolean
        ingredients:
          type: array
          items:
            type: object
            properties:
              ingredient_id:
                type: integer
              ingredient_name:
                type: string
              unit:
                type: string
              current_stock:
                type: number
              minimum_stock:
                type: number
              quantity_required:
                type: number
    RecipeItem:
      type: object
      properties:
        ingredient_id:
          type: integer
        ingredient_name:
          type: string
        unit:
          type: string
        quantity_required:
          type: number
          format: float
    Ingredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        current_stock:
          type: number
        minimum_stock:
          type: number
        cost_per_unit:
          type: number
          nullable: true
        expiration_date:
          type: string
          format: date
          nullable: true
        supplier_id:
          type: integer
          nullable: true
        supplier_name:
          type: string
          nullable: true
        is_low_stock:
          type: boolean
        is_expiring_soon:
          type: boolean
    StockAlerts:
      type: object
      properties:
        low_stock_count:
          type: integer
        expiring_soon_count:
          type: integer
        low_stock:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        expiring_soon:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
    StockMovementType:
      type: string
      description: Type de mouvement de stock
      enum: [IN, OUT, WASTE, ADJUSTMENT]

    Sale:
      type: object
      properties:
        id:
          type: integer
        receipt_number:
          type: string
        cashier_id:
          type: integer
          nullable: true
        total_amount:
          type: number
          format: float
        total_cost:
          type: number
          format: float
        total_margin:
          type: number
          format: float
        total_items:
          type: integer
        status:
          type: string
        payment_method:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
          nullable: true
        completed_at:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              product_id:
                type: integer
              product_name:
                type: string
              quantity:
                type: integer
              unit_price:
                type: number
              cost_per_unit:
                type: number
              margin:
                type: number
              subtotal:
                type: number
        payments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              payment_method:
                type: string
              amount:
                type: number
              status:
                type: string
              provider:
                type: string
              created_at:
                type: string
    PeriodMetrics:
      type: object
      properties:
        sales_count:
          type: integer
        total_revenue:
          type: number
        average_ticket:
          type: number
    SalesMetrics:
      type: object
      properties:
        day:
          $ref: '#/components/schemas/PeriodMetrics'
        week:
          $ref: '#/components/schemas/PeriodMetrics'
        month:
          $ref: '#/components/schemas/PeriodMetrics'
        top_products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              total_sold:
                type: number
              revenue:
                type: number
    Employee:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        user_name:
          type: string
        user_email:
          type: string
        user_role:
          $ref: '#/components/schemas/UserRole'
    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contact_person:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        lead_time:
          type: string
          nullable: true
        quality:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
        purchase_orders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        performance:
          type: object
          properties:
            purchase_orders:
              type: integer
            total_spend:
              type: number
            ingredients_count:
              type: integer
        ingredients:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              current_stock:
                type: number
              cost_per_unit:
                type: number
    PurchaseOrderStatus:
      type: string
      enum: [DRAFT, ORDERED, RECEIVED, CANCELLED]
    PurchaseOrder:
      type: object
      description: Commande fournisseur
      properties:
        id:
          type: integer
        supplier_id:
          type: integer
        supplier_name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        total_cost:
          type: number
          format: float
        received_at:
          type: string
          nullable: true
        created_by:
          type: integer
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              purchase_order_id:
                type: integer
              ingredient_id:
                type: integer
              ingredient_name:
                type: string
                nullable: true
              quantity_ordered:
                type: number
              quantity_received:
                type: number
              unit_cost:
                type: number
    CustomerOrderStatus:
      type: string
      enum: [PENDING, IN_PRODUCTION, READY, DELIVERED, CANCELLED]
    CustomerOrder:
      type: object
      description: Commande client
      properties:
        id:
          type: integer
        customer_name:
          type: string
        customer_phone:
          type: string
          nullable: true
        delivery_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CustomerOrderStatus'
        total_price:
          type: number
          format: float
        special_instructions:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              customer_order_id:
                type: integer
              product_id:
                type: integer
              quantity:
                type: integer
              unit_price:
                type: number
              subtotal:
                type: number
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    Leave:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/LeaveStatus'
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        module:
          type: string
        category:
          type: string
        read:
          type: boolean
        created_at:
          type: string
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        user_name:
          type: string
        user_email:
          type: string
        user_role:
          type: string
        action:
          type: string
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
    AuditLogResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    ForecastResponse:
      type: object
      description: Réponse de GET /ai/forecast
      properties:
        value:
          type: number
          nullable: true
        confidence:
          type: object
          properties:
            level:
              type: string
              enum: [faible, moyenne, haute]
            interval:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        status:
          type: string
          enum: [ok, insufficient_data, error]
        model_version:
          type: string
    AnomalyResponse:
      type: object
      description: Réponse de GET /ai/anomalies
      properties:
        anomalies:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              type:
                type: string
              severity:
                type: string
              confidence:
                type: object
              description:
                type: string
        excluded_products:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [ok, error]
    SegmentationResponse:
      type: object
      description: Réponse de GET /ai/segmentation
      properties:
        segments:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              product_name:
                type: string
              quadrant:
                type: string
                enum: [star, cash_cow, dormant, to_remove, en_observation]
              margin:
                type: number
              sales_frequency:
                type: number
              n_days:
                type: integer
              confidence:
                type: object
        status:
          type: string
          enum: [ok, error]
    InsightsResponse:
      type: object
      description: Réponse de GET /ai/insights
      properties:
        insights:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              type:
                type: string
              message:
                type: string
              confidence:
                type: object
        status:
          type: string
          enum: [ok, error]
    ProductionRecommendation:
      type: object
      description: Réponse de GET /ai/production-recommendations
      properties:
        recommended_quantity:
          type: number
          nullable: true
        forecast:
          type: number
          nullable: true
        stock:
          type: number
        safety_margin:
          type: number
        waste_adjustment:
          type: number
        confidence:
          type: object
        status:
          type: string
          enum: [ok, insufficient_data, manual_review_required, error]
        model_version:
          type: string
        based_on_forecast:
          type: object
    DashboardSummary:
      type: object
      description: Réponse de GET /api/dashboard/summary
      properties:
        kpis:
          type: object
          properties:
            revenue:
              type: number
            critical_stock_count:
              type: integer
            top_products:
              type: array
              items:
                type: object
                properties:
                  product_id:
                    type: integer
                  name:
                    type: string
                  units_sold:
                    type: integer
        forecast_summary:
          type: object
          properties:
            product_id:
              type: integer
            product_name:
              type: string
            horizon_days:
              type: integer
            forecast_next:
              type: number
            status:
              type: string
        active_anomalies_count:
          type: integer
        segmentation_summary:
          type: object
          properties:
            segments_count:
              type: integer
            segments:
              type: array
        status:
          type: string
        cached:
          type: boolean
    Error:
      type: object
      description: Réponse d'erreur standardisée (middleware errorHandler)
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
        code:
          type: string
        timestamp:
          type: string
        error:
          type: string

  responses:
    Unauthorized:
      description: Authentification requise (JWT absent, invalide ou expiré)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid or expired token.
            code: UNAUTHORIZED
            success: false
            message: Invalid or expired token.
    Forbidden:
      description: Accès refusé (rôle/permission non autorisée)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Access denied. Requires one of roles: [ADMIN, PRODUCTION]"
            code: FORBIDDEN
            success: false
            message: "Access denied. Requires one of roles: [ADMIN, PRODUCTION]"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Product not found.
            code: NOT_FOUND
            success: false
            message: Product not found.
    BadRequest:
      description: Requête invalide (champs requis, stock insuffisant, statut invalide…)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Product name and price are required.
            code: VALIDATION_ERROR
            success: false
    ValidationError:
      description: Échec de validation Zod (middleware validate)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    message:
                      type: string
                    code:
                      type: string
          example:
            error: "Validation failed for body: email: Invalid email address."
            details:
              - path: email
                message: Invalid email address.
                code: invalid_email
    TooManyRequests:
      description: Quota de requêtes dépassé (rate limiting)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Trop de requêtes vers l'API. Veuillez réessayer ultérieurement.
            code: TOO_MANY_REQUESTS
            error: Too many requests
    ServerError:
      description: Erreur interne du serveur (500) ou service IA indisponible (502)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error
            code: INTERNAL_ERROR
            success: false
            message: Internal Server Error
paths:
  /api/health:
    get:
      summary: Vérification de l'état du service
      description: Endpoint de santé public (walking skeleton). Ne requiert pas d'authentification.
      tags: [Santé]
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                  service:
                    type: string
                  walking_skeleton:
                    type: boolean
                  sprint1:
                    type: boolean
              example:
                status: UP
                timestamp: '2026-08-21T00:00:00.000Z'
                service: Bakery Management Platform Central API
                walking_skeleton: true
                sprint1: true

  /api/auth/login:
    post:
      summary: Authentification
      description: |
        Authentifie un utilisateur par email/mot de passe et renvoie un JWT.
        Validation Zod (`loginSchema`) : email valide + password non vide.
        Publique (rate-limit dédié : 100 requêtes / 15 min). Enregistre une action
        d'audit LOGIN.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
            example:
              email: admin@bakery.com
              password: password123
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                user:
                  id: 32
                  name: Admin Bakery
                  email: admin@bakery.com
                  role: ADMIN
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/logout:
    post:
      summary: Déconnexion
      description: |
        Déconnexion d'un utilisateur authentifié. Enregistre une action d'audit
        LOGOUT. Le token n'est pas révoqué côté serveur (client-side invalidation).
      tags: [Auth]
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      summary: Profil de l'utilisateur courant
      description: Renvoie les informations de l'utilisateur authentifié (id, name, email, role).
      tags: [Auth]
      responses:
        '200':
          description: Profil de l'utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 32
                name: Admin Bakery
                email: admin@bakery.com
                role: ADMIN
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: User not found.
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/users:
    get:
      summary: Liste des utilisateurs (ADMIN)
      description: Renvoie tous les utilisateurs. Réservé au rôle ADMIN.
      tags: [Auth]
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/products:
    get:
      summary: Liste des produits
      description: |
        Renvoie tous les produits (avec nom de catégorie et recette/ingrédients).
        Endpoint public (aucun middleware auth dans l'implémentation actuelle).
        Filtres : category_id, search.
      tags: [Produits]
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filtrer par catégorie
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Recherche partielle sur le nom
          schema:
            type: string
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Créer un produit
      description: |
        Crée un produit (avec recette optionnelle). Rôles : ADMIN, PRODUCTION.
        Enregistre une action d'audit CREATE_PRODUCT.
      tags: [Produits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                stock_quantity:
                  type: integer
                recipe:
                  type: array
                  items:
                    type: object
                    properties:
                      ingredient_id:
                        type: integer
                      quantity_required:
                        type: number
            example:
              name: Croissant Pur Beurre
              description: Viennoiserie au beurre
              price: 1.3
              category_id: 23
              stock_quantity: 60
              recipe:
                - ingredient_id: 42
                  quantity_required: 0.1
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
