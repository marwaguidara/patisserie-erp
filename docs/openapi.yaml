components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
    CategoryIdQuery:
      name: category_id
      in: query
      required: false
      schema:
        type: integer
    ProductIdQuery:
      name: product_id
      in: query
      required: false
      schema:
        type: integer
    IngredientStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [low_stock, expiring_soon]
    PeriodQuery:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [day, week, month]
    StartDateQuery:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDateQuery:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date
    StatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
    SupplierIdQuery:
      name: supplier_id
      in: query
      required: false
      schema:
        type: integer
    DeliveryDateQuery:
      name: delivery_date
      in: query
      required: false
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User lacks required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request payload or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer
          nullable: true
      required: [error]

    SuccessMessage:
      type: object
      properties:
        message:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        walking_skeleton:
          type: boolean
        sprint1:
          type: boolean

    ForecastResponse:
      type: object
      required: [value, confidence, status]
      properties:
        value:
          type: number
          nullable: true
        confidence:
          type: object
          required: [level, interval]
          properties:
            level:
              type: string
              enum: [haute, moyenne, faible]
            interval:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        status:
          type: string
          enum: [ok, insufficient_data]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, EMPLOYEE, STOCK, PRODUCTION, CASHIER]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    RecipeInput:
      type: object
      required: [ingredient_id, quantity_required]
      properties:
        ingredient_id:
          type: integer
        quantity_required:
          type: number

    RecipeItem:
      type: object
      properties:
        recipe_item_id:
          type: integer
        ingredient_id:
          type: integer
        ingredient_name:
          type: string
        unit:
          type: string
        quantity_required:
          type: number

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        stock_quantity:
          type: integer
        is_active:
          type: boolean
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeItem'

    RecipeUpdateResponse:
      type: object
      properties:
        message:
          type: string
        recipe:
          type: array
          items:
            $ref: '#/components/schemas/RecipeItem'

    ProductionResponse:
      type: object
      properties:
        message:
          type: string
        result:
          type: object
          properties:
            product:
              $ref: '#/components/schemas/Product'
            produced_quantity:
              type: integer
            updated_ingredients:
              type: array
              items:
                $ref: '#/components/schemas/Ingredient'
            alerts:
              type: array
              items:
                $ref: '#/components/schemas/Ingredient'

    Ingredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        current_stock:
          type: number
        minimum_stock:
          type: number
        cost_per_unit:
          type: number
        expiration_date:
          type: string
          format: date
          nullable: true
        supplier_id:
          type: integer
          nullable: true
        supplier_name:
          type: string
          nullable: true
        is_low_stock:
          type: boolean
          nullable: true
        is_expiring_soon:
          type: boolean
          nullable: true

    StockMovement:
      type: object
      properties:
        id:
          type: integer
        ingredient_id:
          type: integer
        movement_type:
          type: string
        quantity:
          type: number
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        batch_number:
          type: string
          nullable: true

    IngredientDetail:
      type: object
      properties:
        ingredient:
          $ref: '#/components/schemas/Ingredient'
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'

    StockMovementRequest:
      type: object
      required: [movement_type, quantity]
      properties:
        movement_type:
          type: string
          enum: [IN, OUT, WASTE, ADJUSTMENT]
        quantity:
          type: number
        reason:
          type: string
        expiration_date:
          type: string
          format: date
        batch_number:
          type: string

    StockMovementResponse:
      type: object
      properties:
        message:
          type: string
        ingredient:
          $ref: '#/components/schemas/Ingredient'

    AlertSummary:
      type: object
      properties:
        low_stock_count:
          type: integer
        expiring_soon_count:
          type: integer
        low_stock:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        expiring_soon:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    SaleItem:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
        subtotal:
          type: number

    SaleInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
        paymentMethod:
          type: string
        customerName:
          type: string
          nullable: true
        customerPhone:
          type: string
          nullable: true

    Sale:
      type: object
      properties:
        id:
          type: integer
        cashier_id:
          type: integer
        total_amount:
          type: number
        status:
          type: string
        created_at:
          type: string
          format: date-time
        payment_method:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'

    SalesMetrics:
      type: object
      additionalProperties: true

    Employee:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          format: email
          nullable: true
        user_role:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    EmployeeInput:
      type: object
      required: [first_name, last_name]
      properties:
        user_id:
          type: integer
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
        phone:
          type: string
        job_title:
          type: string
        hire_date:
          type: string
          format: date
        address:
          type: string

    Schedule:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        shift_start:
          type: string
          format: date-time
        shift_end:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        employee_first_name:
          type: string
          nullable: true
        employee_last_name:
          type: string
          nullable: true

    ScheduleInput:
      type: object
      required: [employee_id, shift_start, shift_end]
      properties:
        employee_id:
          type: integer
        shift_start:
          type: string
          format: date-time
        shift_end:
          type: string
          format: date-time
        notes:
          type: string

    Leave:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          type: string
