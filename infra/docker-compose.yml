version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: bakery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-patisserie_erp}
      MYSQL_USER: ${MYSQL_USER:-bakery_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bakery_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: bakery_backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-bakery_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-bakery_password}
      DB_NAME: ${MYSQL_DATABASE:-patisserie_erp}
      # Environment-based JWT secret — NEVER hardcode a secret here.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: bakery_ai_service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-patisserie_erp}
      DB_USER: ${MYSQL_USER:-bakery_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-bakery_password}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ai_service_data:/app/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bakery_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
      - ai-service

volumes:
  mysql_data:
  ai_service_data:

