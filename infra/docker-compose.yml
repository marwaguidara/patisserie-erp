version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bakery_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakery_db}
      POSTGRES_USER: ${POSTGRES_USER:-bakery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakery_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bakery_user} -d ${POSTGRES_DB:-bakery_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bakery_backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_CLIENT: pg
      # Database connectivity is provided via the Postgres service (postgres:5432)
      DATABASE_URL: postgres://${POSTGRES_USER:-bakery_user}:${POSTGRES_PASSWORD:-bakery_password}@postgres:5432/${POSTGRES_DB:-bakery_db}
      # Environment-based JWT secret — NEVER hardcode a secret here.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: bakery_ai_service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bakery_db}
      DB_USER: ${POSTGRES_USER:-bakery_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bakery_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ai_service_data:/app/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bakery_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
      - ai-service

volumes:
  postgres_data:
  ai_service_data:
