server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend container (bakery_backend).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI service proxy. The frontend ONLY ever calls the same-origin "/ai/..." path;
    # it never knows the real AI host/port. The mapping lives here and in the backend:
    #   Docker: /ai/* -> http://ai-service:8000/* (service name on the compose network)
    #   Local dev (no Docker/nginx): backend/src/app.js mounts an Express reverse proxy
    #     on "/ai/*" -> http://127.0.0.1:8000/* so the browser still uses same-origin "/ai".
    # Note: the trailing slash in proxy_pass rewrites /ai/forecast -> /forecast upstream
    # (the "/ai" prefix is stripped from the path forwarded to the AI service).
    location /ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files + SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
